[project]
name = "http-crud-api"
version = "1.0.1"
description = "A small JSON-based HTTP CRUD API for users"
readme = "README.md"
authors = [
    { name = "sokolov-na", email = "225724418+sokolov-na@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
http-crud-api = "http_crud_api.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.basedpyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
